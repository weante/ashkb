# 批次 5（工程化）：依赖版本的**单一来源**。
#
# 为什么需要：此前版本号散落在 `build.gradle.kts` 的 plugins 块与 dependencies 块里
# （AGP 8.5.2 / Kotlin 2.0.20 / KSP 2.0.20-1.0.25 / Room 2.6.1 / Compose BOM 2024.09.03 …），
# 升一个版本要在多处手改，且「哪个库和哪个版本配套」只存在于人脑里。
# 第四份审查报告把「依赖版本硬编码」列为工程化问题，这是收敛点。
#
# 用法（Gradle 8.x 自动识别本文件）：
#   · 插件：`alias(libs.plugins.android.application)`
#   · 依赖：`implementation(libs.room.runtime)`
#   · 版本目录里**只写版本与坐标**，不写 `apply false` 之类的策略（策略留在构建脚本里）
#
# ⚠️ 本机到官方 Maven 仓库不可达，依赖解析走用户级 `~/.gradle/init.gradle` 指向的国内镜像
# （项目文件里保持官方仓库地址，见 HANDOFF §5）。

[versions]
agp = "8.5.2"
kotlin = "2.0.20"
ksp = "2.0.20-1.0.25"
room = "2.6.1"
composeBom = "2024.09.03"
activityCompose = "1.9.2"
lifecycle = "2.8.6"
coreKtx = "1.13.1"
navigationCompose = "2.8.4"
kotlinxSerialization = "1.7.3"
junit = "4.13.2"
json = "20240303"
robolectric = "4.13"
androidxTestExtJunit = "1.1.5"
androidxTestRunner = "1.5.0"
detekt = "1.23.7"

[libraries]
# Room
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
# 批次 2：instrumented 迁移测试用（MigrationTestHelper / schema 比对）
room-testing = { module = "androidx.room:room-testing", version.ref = "room" }

# Compose（BOM 管版本，其余不写版本）
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# 单元测试
junit = { module = "junit:junit", version.ref = "junit" }
json = { module = "org.json:json", version.ref = "json" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }

# instrumented 测试（androidTest）
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
