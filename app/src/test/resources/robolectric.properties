# Robolectric 默认测试 SDK。
#
# 为什么钉死 34：依赖升级第 2 步把 targetSdk 提到 36，而 Robolectric 4.13 最高只支持
# SDK 35（其 DefaultSdkPicker 会按 targetSdk 选默认值），于是所有没写 @Config(sdk=[34])
# 的测试类都在初始化阶段抛 IllegalArgumentException。
#
# 这些测试验证的是业务逻辑（排药、依从性、提醒计算、迁移回填等），与设备 API 级别无关，
# 统一钉在 34 与既有 35 个显式写 @Config(sdk = [34]) 的测试保持一致。
# 将来 Robolectric 支持 36 后，可把这里改成 36 并同步那些显式声明。
sdk=34
