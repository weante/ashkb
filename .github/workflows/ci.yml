# D1: CI -- build + unit tests on every push to main and every PR.
# Repo has no gradlew scripts (local builds use a pinned Gradle 8.7 install,
# same version as gradle/wrapper/gradle-wrapper.properties), so we provision
# Gradle via gradle/actions/setup-gradle instead.
# assembleRelease runs the R8 pipeline (debug-signing fallback without
# local.properties keystore) to catch keep-rule regressions early.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build and test
        run: gradle assembleDebug assembleRelease testDebugUnitTest --console=plain
